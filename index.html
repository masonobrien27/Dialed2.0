function normaliseLegacyData(raw) {
 if(!raw||typeof raw!=='object')throw new Error('This file does not contain a progress workspace.');
 const text=(v,max,label)=>{if(typeof v!=='string'||v.length>max)throw new Error(`Invalid ${label}.`);return v;};
 const val=(v,min,max,label,integer=false)=>{if(!isFiniteRange(v,min,max)||(integer&&!Number.isInteger(v)))throw new Error(`Invalid ${label}.`);return v;};
 const dt=(v,optional=false)=>{if(optional&&v==='')return '';if(!validDate(v))throw new Error('A date is not valid.');return v;};
 const ids=new Set();
 const id=v=>{if(typeof v!=='string'||!/^[a-zA-Z0-9_-]{1,80}$/.test(v)||ids.has(v))throw new Error('Invalid or duplicate record ID.');ids.add(v);return v;};
 const array=(v,max,label)=>{if(!Array.isArray(v)||v.length>max)throw new Error(`Invalid ${label}.`);return v;};
 const s=raw.settings;if(!s)throw new Error('Goal settings are missing.');
 const data={settings:{semester:text(s.semester,80,'semester name'),gymTarget:val(s.gymTarget,1,21,'gym goal',true),cardioTarget:val(s.cardioTarget,1,21,'cardio goal',true),stepsTarget:val(s.stepsTarget,1,100000,'steps goal',true),weightTarget:val(s.weightTarget,.1,700,'weight goal'),savingsTarget:val(s.savingsTarget,.01,100000000,'savings goal'),savingsDeadline:dt(s.savingsDeadline,true)},courses:[],weights:[],workouts:[],steps:[],savings:[]};
 data.courses=array(raw.courses,30,'subjects').map(c=>({id:id(c.id),name:text(c.name,90,'subject name'),code:text(c.code,5,'subject code'),target:val(c.target,0,100,'subject target'),reviewed:!!c.reviewed,targetProvisional:!!c.targetProvisional,weeklyProgress:normaliseStudyWeeks(c.weeklyProgress),assessments:array(c.assessments,150,'assessments').map(a=>{const result=a.result===null?null:val(a.result,0,100,'assessment result');const clean={id:id(a.id),name:text(a.name,100,'assessment name'),weight:val(a.weight,.01,100,'assessment weight'),target:val(a.target,0,100,'assessment target'),date:dt(a.date,true),result,rawScore:null,rawTotal:null,review:!!a.review};if(result!==null&&a.rawScore!==null&&a.rawTotal!==null&&a.rawScore!==undefined&&a.rawTotal!==undefined){clean.rawScore=val(a.rawScore,0,1000000,'raw result');clean.rawTotal=val(a.rawTotal,.0001,1000000,'total marks');if(clean.rawScore>clean.rawTotal||Math.abs(clean.rawScore/clean.rawTotal*100-result)>.001)throw new Error('Raw marks and percentage do not match.');}return clean;})}));
 const unique=(records,key)=>{const seen=new Set();for(const r of records){if(seen.has(r[key]))throw new Error(`Duplicate ${key} entry.`);seen.add(r[key]);}return records;};
 data.weights=unique(array(raw.weights,10000,'weight entries').map(r=>({id:id(r.id),date:dt(r.date),value:val(r.value,.1,700,'weight')})),'date');
 data.workouts=array(raw.workouts,10000,'workouts').map(r=>{if(!['gym','swim','run'].includes(r.type))throw new Error('Unknown workout type.');const split=r.type==='gym'?(r.split??'other'):null;if(split!==null&&!GYM_SPLITS.some(([key])=>key===split))throw new Error('Unknown gym split.');return {id:id(r.id),date:dt(r.date),type:r.type,split,otherDetail:r.type==='gym'&&split==='other'?text(r.otherDetail||'',80,'other workout detail'):'',hard:r.type!=='gym'&&!!r.hard,duration:r.duration===null?null:val(r.duration,.1,1440,'duration'),distance:r.distance===null?null:val(r.distance,.1,100000,'distance'),notes:text(r.notes||'',300,'workout note')};});
 data.steps=unique(array(raw.steps,2500,'weekly step entries').map(r=>{const w=dt(r.week);if(weekStart(w)!==w)throw new Error('Step weeks must start on a Monday.');return {id:id(r.id),week:w,value:val(r.value,0,100000,'weekly steps',true)};}),'week');
 data.savings=unique(array(raw.savings,2500,'savings entries').map(r=>{if(typeof r.month!=='string'||!validDate(`${r.month}-01`))throw new Error('A savings month is not valid.');return {id:id(r.id),month:r.month,balance:val(r.balance,0,100000000,'savings balance')};}),'month');
 return data;
}

function normaliseData(raw){
 const clean=normaliseLegacyData(raw),s=raw.settings;
 assert(s.weeklyBudget==null||isFiniteRange(s.weeklyBudget,.01,10000000),'Invalid weekly spending limit.');
 assert(s.teachingWeek==null||(Number.isInteger(s.teachingWeek)&&s.teachingWeek>=1&&s.teachingWeek<=13),'Teaching week must be 1 to 13.');
 const days=s.trainingDays??[];
 assert(Array.isArray(days)&&days.length<=7&&days.every(n=>Number.isInteger(n)&&n>=0&&n<=6)&&new Set(days).size===days.length,'Invalid training days.');
 Object.assign(clean.settings,{weeklyBudget:s.weeklyBudget??400,teachingWeek:s.teachingWeek??null,trainingDays:[...days].sort()});

 clean.dailySteps=unique(arr(raw.dailySteps??[],10000,'daily steps').map(r=>({id:id(r.id),date:dt(r.date),value:val(r.value,0,100000,'daily steps',true)})),'date');

function submitForm(f){
 const kind=f.dataset.form,fd=new FormData(f),get=n=>String(fd.get(n)??'').trim(),id=get('id');
 const n=(name,min,max,label,integer=false,optional=false)=>{const text=get(name);if(optional&&text==='')return null;assert(text!=='',`${label} is required.`);const value=Number(text);assert(isFiniteRange(value,min,max)&&(!integer||Number.isInteger(value)),`${label} must be ${integer?'a whole number':'a number'} from ${min} to ${max}.`);return value;};
 const text=(name,max,label)=>{const value=get(name);assert(value.length>0&&value.length<=max,`${label} is required (maximum ${max} characters).`);return value;};
 const dt=(name,optional=false,pastOnly=false)=>{const v=get(name);if(optional&&!v)return '';assert(validDate(v),'Choose a valid date.');if(pastOnly)assert(v<=today(),'Progress cannot be recorded for a future date.');return v;};
 try{
  let after=null,message='Saved.';
  if(kind==='checkin'){const date=dt('date',false,true);checkIn(date);closeModal();return;}else if(kind==='weight'||kind==='daily-steps'){
   const date=dt('date',false,true),value=n('value',kind==='weight'?.1:0,kind==='weight'?700:100000,kind==='weight'?'Weight':'Steps',kind!=='weight');
   mutate(d=>upsert(d,kind==='weight'?'weights':'dailySteps',{id,date,value},'date'),kind==='weight'?'Weight saved.':'Daily steps saved.');
  }else if(kind==='weekly-steps'){
   const week=weekStart(dt('week',false,true)),value=n('value',0,100000,'Average daily steps',true);mutate(d=>upsert(d,'steps',{id,week,value},'week'),'Weekly step average saved.');
  }else if(kind==='spending'){
   const week=weekStart(dt('week',false,true)),amount=round2(n('amount',0,10000000,'Weekly spend')),budget=n('budget',.01,10000000,'Weekly budget',false,true);
   mutate(d=>{upsert(d,'spending',{id,week,amount,updatedAt:today()},'week');d.settings.weeklyBudget=budget===null?null:round2(budget);},'Weekly spending total updated.');
  }else if(kind==='savings'){

function replaceWorkspace(data,message){
 const clean=normaliseData(data);
 try{const prior=localStorage.getItem(STORAGE_KEY);if(prior)localStorage.setItem('dialed.previous-workspace',prior);}catch(e){/* Best-effort local rollback; user-facing export is still recommended. */}
 recoveryRaw=null;loadMessage='';recoveryKey='';const saved=writeState(clean);state=clean;currentCourse='';selectedWeek=healthWeek=moneyWeek=weekStart(today());readRoute();render();toast(message+(saved?'':' Session only - export a backup.'));

async function receiveImport(file){
 pendingImport=null;
 if(!file)return;
 try{
  assert(file.size<=8000000,'Backup must be smaller than 8 MB.');
  const p=JSON.parse(await file.text());let raw;
  if(p.format==='dialed-workspace'){assert(p.version===3,'Unsupported Dialed backup version.');raw=p.data;}
  else if(p.format==='momentum-workspace'){assert([1,2].includes(p.version),'Unsupported Momentum backup version.');assert(p.source!=='demo','This is a sample workspace. Export your personal Momentum workspace instead.');raw=p.data;}
  else if([1,2].includes(p.version)&&p.personal){raw=p.personal;}
  else throw new Error('Choose an exported Dialed or personal Momentum backup.');
  const clean=normaliseData(raw);
  assert(clean.checkIns.every(d=>d<=today()),'The backup contains future check-in dates. Check the device date or the backup.');
  pendingImport=clean;
  const count=['weights','workouts','steps','dailySteps','spending','savings'].reduce((sum,key)=>sum+clean[key].length,0);
  openModal('Replace your workspace?',`<div class="notice warn">${icon('info')}<div>Importing replaces <strong>all current logs, goals, study checkboxes and check-in history</strong>. It does not merge the two workspaces.</div></div><p class="small-text muted">This backup has ${clean.courses.length} subjects, ${count} tracking entries and ${clean.checkIns.length} check-ins. Export your current workspace first to keep a copy.</p><div class="form-actions">${btn('Export current','export','','button subtle')}${btn('Cancel','close','','button subtle')}${btn('Replace data','confirm-import','','button primary')}</div>`,'DIALED / IMPORT');
 }catch(e){toast(e.message||'Invalid backup. Your current data has not changed.');}
}

// Quick-log forms select the entry for the chosen date/period. Changing the date
// in a quick-log form must never move today's existing record to yesterday.
// Explicit history edits still move their one selected record, with duplicate checks.
function enablePeriodLookup(kind,id){const f=$(`form[data-form="${kind}"]`);if(f&&!id)f.dataset.periodLookup='true';}
function syncPeriodEntry(f){
 if(f.dataset.periodLookup!=='true')return;
 const kind=f.dataset.form;
 let key,period,valueName,periodValue;
 if(kind==='weight'||kind==='daily-steps'){key=kind==='weight'?'weights':'dailySteps';period='date';valueName='value';periodValue=f.elements.date.value;}
 else if(kind==='weekly-steps'||kind==='spending'){key=kind==='spending'?'spending':'steps';period='week';valueName=kind==='spending'?'amount':'value';const v=f.elements.week.value;if(!validDate(v))return;periodValue=weekStart(v);}
 else if(kind==='savings'){key='savings';period='month';valueName='balance';periodValue=f.elements.month.value;}
 else return;
 const r=state[key].find(x=>x[period]===periodValue);
 f.elements.id.value=r?.id||'';f.elements[valueName].value=r?.[valueName]??'';
}

 else if(a==='delete-entry'){
  const key=el.dataset.kind;assert(['weights','workouts','steps','dailySteps','spending','savings','plans'].includes(key),'Unknown entry type.');

 }else if(a==='confirm'){
  const fn=pendingConfirm;pendingConfirm=null;if(fn)fn();closeModal();
 }else if(a==='export')exportBackup();
 else if(a==='export-recovery'&&recoveryRaw!==null){exportFile(recoveryRaw,`Dialed-recovery-${today()}.json`);toast('Original data prepared for download. Keep this file private.');}
